<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lost · Vitalis</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#0d100c;color:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;height:100%;}
    body{display:flex;align-items:center;justify-content:center;padding:32px;}
    .wrap{max-width:640px;text-align:center;}
    .num{font-family:'Cormorant Garamond','Times New Roman',serif;font-size:clamp(120px,18vw,220px);font-weight:300;line-height:1;letter-spacing:-.012em;color:#a8c97f;font-style:italic;margin:0 0 24px;}
    h1{font-family:'Cormorant Garamond','Times New Roman',serif;font-size:clamp(32px,4vw,52px);font-weight:400;line-height:1.05;margin:0 0 24px;letter-spacing:-.012em;}
    p{font-size:16px;color:rgba(244,241,234,.78);max-width:480px;margin:0 auto 36px;line-height:1.6;}
    a.cta{display:inline-flex;align-items:center;gap:10px;background:#a8c97f;color:#1a2410;border:none;padding:14px 22px;border-radius:999px;font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s,transform .25s;}
    a.cta:hover{background:#b8d989;transform:translateY(-1px);}
    a.cta .arrow{font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;}
    .meta{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:rgba(244,241,234,.4);margin-top:48px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="num">404.</div>
    <h1>This one&rsquo;s not on the map.</h1>
    <p>The page you tried to reach doesn&rsquo;t exist, or has moved. The rest of the site is still here.</p>
    <a class="cta" href="/"><span>Back to home</span><span class="arrow">→</span></a>
    <div class="meta">Vitalis · Stockholm · MMXXVI</div>
  </div>
</body>
</html>
